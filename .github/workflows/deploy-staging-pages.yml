# Manual staging Pages deployment only. Public repo: VITE values are deliberately public.
name: Deploy organizer portal to staging Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: staging-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment: staging
    env:
      VITE_DEPLOYMENT_STAGE: staging
      VITE_BASE_PATH: /mystudy0sg-test-/
      VITE_STYTCH_PUBLIC_TOKEN: ${{ vars.STAGING_STYTCH_PUBLIC_TOKEN }}
      VITE_STYTCH_ORGANIZATION_ID: ${{ vars.STAGING_STYTCH_ORGANIZATION_ID }}
      VITE_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=optional
      - run: node scripts/release-preflight.mjs staging
      - run: npm run check:nav
      - run: npm run test:studios
      - run: npm run test:security
      - run: npm run test:mobile
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
